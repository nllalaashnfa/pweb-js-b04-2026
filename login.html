<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - Mini Shopee</title>
  <link rel="stylesheet" href="login.css">
  <script src="login.js" defer></script>
</head>
<body>

  <main class="halaman-login">
    <section class="kartu-login">
      <h1>Masuk ke akunmu</h1>
      <p class="subjudul">Gunakan username &amp; password akunmu.</p>

      <form id="form-login">
        <label for="input-username">Username</label>
        <input type="text" id="input-username" autocomplete="username">

        <label for="input-password">Password</label>
        <input type="password" id="input-password" autocomplete="current-password">

        <div id="status-login"></div>

        <button type="submit" id="tombol-masuk">Masuk</button>
      </form>
    </section>
  </main>

</body>
</html>
